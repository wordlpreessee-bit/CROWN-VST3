name: Build CROWD VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target CROWD_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $plugin = Get-ChildItem -Path build -Filter CROWD.vst3 -Recurse -Directory | Select-Object -First 1
          if (-not $plugin) { throw "CROWD.vst3 was not produced" }
          Copy-Item $plugin.FullName dist/CROWD.vst3 -Recurse
          Compress-Archive -Path dist/CROWD.vst3 -DestinationPath CROWD-VST3-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CROWD-VST3-Windows
          path: CROWD-VST3-Windows.zip
          if-no-files-found: error
